name: Aggiorna Database da Release Esterna

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'

jobs:
  fetch_and_update_db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DB: busto_pagamenti.db
      DB_URL: https://github.com/F041/osservatorio-statistico-bustoarsizio-tubatura-dati/releases/latest/download/busto_pagamenti.db

    steps:
      - name: Checkout codice esploratore (questo repo)
        uses: actions/checkout@v4

      # -f: con un errore HTTP curl si ferma, invece di salvare la pagina d'errore al posto del database
      - name: Scarica ultimo database dalla release
        id: scarica
        run: |
          curl -fsSL --retry 3 -o nuovo.db "$DB_URL"
          if ! head -c 15 nuovo.db | grep -q 'SQLite format 3'; then
            echo "::error::Il file scaricato non è un database SQLite"
            exit 1
          fi
          if cmp -s nuovo.db "$DB"; then
            echo "Database uguale a quello pubblicato: niente da aggiornare."
            rm nuovo.db
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
          else
            mv nuovo.db "$DB"
            echo "cambiato=si" >> "$GITHUB_OUTPUT"
          fi

      # La data mostrata in Scarica dati è quella in cui il database è cambiato davvero
      - name: Registra data aggiornamento
        if: steps.scarica.outputs.cambiato == 'si'
        run: |
          echo "{\"lastUpdate\": \"$(date -u +%d/%m/%Y)\"}" > last_update.json

      - name: Genera dati del cruscotto
        if: steps.scarica.outputs.cambiato == 'si'
        run: python3 scripts/build_cruscotto.py "$DB" data/cruscotto.json

      - name: Committa e pusha database, data e cruscotto
        if: steps.scarica.outputs.cambiato == 'si'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$DB" last_update.json data/cruscotto.json
          git commit -m "Aggiornamento automatico database e data ($DB)"
          git push
