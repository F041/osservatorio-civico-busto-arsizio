name: Pubblica il sito

# Pubblica il sito su GitHub Pages con data/notizie.json creato al momento: i fatti delle notizie contengono i link agli
# articoli, che non vanno mai nel repo (CLAUDE.md). Poi avvisa con una issue se ci sono fatti da controllare.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # I commit dei workflow di dati usano GITHUB_TOKEN e non fanno partire "push": si pubblica quando finiscono
  workflow_run:
    workflows: ['Aggiorna conteggi Sicurezza', 'Aggiorna Database da Release Esterna']
    types: [completed]
  # Ogni giorno, dopo la raccolta delle 4:41 UTC: porta sul sito i fatti caricati dal PC (scripts/episodi_notizie.py)
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # issue di avviso dei fatti da controllare
    steps:
      - name: Checkout di main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa il client Firestore
        run: pip install google-cloud-firestore==2.34.1

      # Gli episodi stanno nella collezione notizie_episodi, chiusa al sito. Account di servizio sicurezza-conteggi,
      # lo stesso di notizie.yml. Legge poche centinaia di documenti: la quota gratuita è di 50.000 letture al giorno
      - name: Fatti delle notizie
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/account.json" python3 scripts/episodi_notizie.py esporta "$RUNNER_TEMP/episodi.jsonl"
          rm "$RUNNER_TEMP/account.json"
          # I fatti già pubblicati tengono il loro id (build_notizie.primo_episodio): senza il file di adesso la
          # revisione già fatta su alcuni fatti andrebbe persa, quindi meglio non pubblicare
          curl -sfL --retry 3 https://f041.github.io/osservatorio-civico-busto-arsizio/data/notizie.json -o "$RUNNER_TEMP/precedente.json" \
            || { echo "::error::data/notizie.json pubblicato non raggiungibile"; exit 1; }
          python3 scripts/build_notizie.py "$RUNNER_TEMP/episodi.jsonl" data/notizie.json revisione/notizie.tsv "$RUNNER_TEMP/precedente.json"
          rm "$RUNNER_TEMP/episodi.jsonl"

      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Una sola issue di avviso aperta alla volta: si apre quando ci sono fatti da controllare, riceve un commento
      # quando ne arrivano di nuovi e si chiude quando sono tutti controllati (revisione.html e revisione.yml).
      # Se non riesce, il sito si pubblica lo stesso
      - name: Avviso dei fatti da controllare
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITOLO="Fatti dalle notizie da controllare"
          N=$(python3 scripts/avviso_revisione.py data/notizie.json revisione/notizie.tsv "$RUNNER_TEMP/avviso.md")
          echo "Fatti da controllare: $N"
          APERTA=$(gh issue list --state open --author "app/github-actions" --search "\"$TITOLO\" in:title" --json number -q '.[0].number')
          if [ "$N" = "0" ]; then
            [ -z "$APERTA" ] || gh issue close "$APERTA" --comment "Tutti i fatti sono controllati."
            exit 0
          fi
          if [ -z "$APERTA" ]; then
            gh issue create --title "$TITOLO" --body-file "$RUNNER_TEMP/avviso.md"
            exit 0
          fi
          PRIMA=$(gh issue view "$APERTA" --json body -q .body | sed -n 's/.*da-controllare: \([0-9]*\).*/\1/p')
          gh issue edit "$APERTA" --body-file "$RUNNER_TEMP/avviso.md"
          if [ "$N" -gt "${PRIMA:-0}" ]; then
            gh issue comment "$APERTA" --body "Sono arrivati fatti nuovi: ora sono $N da controllare."
          fi

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: pagine
        uses: actions/deploy-pages@v4
