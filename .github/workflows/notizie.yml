name: Raccogli notizie

on:
  workflow_dispatch:
  # Una volta al giorno, alle 4:41 UTC: lontano dall'inizio dell'ora e dalle ore di punta, quando GitHub
  # ritarda o salta più spesso i lavori programmati. Ogni fonte copre più di un giorno (scripts/raccogli_notizie.py)
  schedule:
    - cron: '41 4 * * *'

# Due raccolte non devono scrivere insieme
concurrency: notizie

jobs:
  raccolta:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa il client Firestore
        run: pip install google-cloud-firestore==2.34.1

      # L'elenco sta nella collezione notizie_articoli, chiusa al sito: il repo è pubblico e i link contengono i titoli.
      # Account di servizio sicurezza-conteggi (ruolo Cloud Datastore User), lo stesso di sicurezza.yml
      - name: Raccogli gli articoli nuovi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/account.json" python3 scripts/raccogli_notizie.py
          rm "$RUNNER_TEMP/account.json"
